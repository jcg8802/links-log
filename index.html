<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JClaw Links Log</title>
  <style>
    :root {
      --bg: #0d0d0d; --card: #161616; --border: #2a2a2a;
      --accent: #ff6b35; --accent2: #ff9a5c;
      --text: #e8e8e8; --muted: #888;
      --green: #4caf50; --blue: #4fc3f7; --purple: #ce93d8; --yellow: #ffd54f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    header {
      background: linear-gradient(135deg, #1a0a00 0%, #0d0d0d 60%);
      border-bottom: 1px solid var(--border);
      padding: 32px 40px 24px;
      display: flex; align-items: center; gap: 20px;
    }
    .fox { font-size: 48px; }
    .header-text h1 { font-size: 28px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .header-text p { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .stats-bar {
      display: flex; gap: 32px; padding: 20px 40px;
      border-bottom: 1px solid var(--border); background: #111; flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat .num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat .label { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }
    .filters {
      padding: 16px 40px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    .filter-label { color: var(--muted); font-size: 13px; }
    .filter-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .search-input {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 6px 14px; border-radius: 20px; font-size: 13px; outline: none;
      width: 240px; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .timeline { padding: 32px 40px; max-width: 1400px; }
    .day-group { margin-bottom: 48px; }
    .day-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .day-date { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
    .day-line { flex: 1; height: 1px; background: var(--border); }
    .day-count {
      font-size: 12px; color: var(--muted); background: var(--card);
      border: 1px solid var(--border); padding: 2px 10px; border-radius: 12px;
    }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
      transition: border-color 0.2s, transform 0.2s; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card-top { display: flex; align-items: flex-start; gap: 12px; }
    .card-emoji { font-size: 28px; flex-shrink: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .card-url {
      font-size: 11px; color: var(--accent2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      background: rgba(255,107,53,0.08); padding: 5px 10px; border-radius: 6px;
      text-decoration: none; display: block;
    }
    .card-url:hover { text-decoration: underline; }
    .card-footer { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .tag-app { background: rgba(76,175,80,0.15); color: var(--green); border: 1px solid rgba(76,175,80,0.3); }
    .tag-sheet { background: rgba(79,195,247,0.15); color: var(--blue); border: 1px solid rgba(79,195,247,0.3); }
    .tag-doc { background: rgba(206,147,216,0.15); color: var(--purple); border: 1px solid rgba(206,147,216,0.3); }
    .tag-link { background: rgba(255,213,79,0.15); color: var(--yellow); border: 1px solid rgba(255,213,79,0.3); }
    footer { text-align: center; padding: 40px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
  </style>
</head>

let currentFilter = 'all';

function renderTimeline(filter = 'all', search = '') {
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  const searchLower = search.toLowerCase();
  [...LINKS].reverse().forEach(group => {
    const filtered = group.items.filter(item => {
      const matchesFilter = filter === 'all' || item.type === filter;
      const matchesSearch = !search || item.title.toLowerCase().includes(searchLower) || item.desc.toLowerCase().includes(searchLower);
      return matchesFilter && matchesSearch;
    });
    if (filtered.length === 0) return;
    const dayGroup = document.createElement('div');
    dayGroup.className = 'day-group';
    dayGroup.innerHTML = `
      <div class="day-header">
        <span class="day-date">📅 ${group.date}</span>
        <div class="day-line"></div>
        <span class="day-count">${filtered.length} link${filtered.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="cards-grid">
        ${filtered.map(item => `
          <div class="card" onclick="window.open('${item.url}', '_blank')">
            <div class="card-top">
              <span class="card-emoji">${item.emoji}</span>
              <div class="card-info">
                <div class="card-title">${item.title}</div>
                <div class="card-desc">${item.desc}</div>
              </div>
            </div>
            <a class="card-url" href="${item.url}" target="_blank" onclick="event.stopPropagation()">${item.url.replace('https://', '')}</a>
            <div class="card-footer">
              <span class="tag tag-${item.type}">${item.type === 'app' ? '🌐 GitHub Pages' : item.type === 'sheet' ? '📊 Google Sheet' : '🔗 Link'}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    timeline.appendChild(dayGroup);
  });
}

function filterCards(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTimeline(type, document.querySelector('.search-input').value);
}

function searchCards(val) { renderTimeline(currentFilter, val); }
